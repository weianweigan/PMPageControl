name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore Du.PMPage.Wpf.sln

    - name: Build
      run: dotnet build Du.PMPage.Wpf.sln --configuration Release --no-restore

    - name: Pack (Tag)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        dotnet pack Du.PMPage.Wpf/Du.PMPage.Wpf.csproj --configuration Release --no-build -p:Version=$version -o ./artifacts

    - name: Upload artifacts (Tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 7
