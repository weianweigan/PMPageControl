name: NugetPublish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Parse version from tag
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        # Validate semver-ish format
        if ($version -notmatch '^\d+\.\d+\.\d+') {
          Write-Error "Tag '${{ github.ref_name }}' does not yield a valid version (got '$version'). Expected pattern: vX.Y.Z"
          exit 1
        }
        echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

    - name: Restore
      run: dotnet restore Du.PMPage.Wpf.sln

    - name: Build
      run: dotnet build Du.PMPage.Wpf.sln --configuration Release --no-restore

    - name: Pack
      run: dotnet pack Du.PMPage.Wpf/Du.PMPage.Wpf.csproj --configuration Release --no-build -p:Version=$env:PACKAGE_VERSION -o ./artifacts

    - name: Push to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NugetKey }} --skip-duplicate

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
