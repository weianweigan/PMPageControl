name: NugetPublish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Parse version from tag
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        # Validate semver-ish format
        if ($version -notmatch '^\d+\.\d+\.\d+') {
          Write-Error "Tag '${{ github.ref_name }}' does not yield a valid version (got '$version'). Expected pattern: vX.Y.Z"
          exit 1
        }
        echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

    - name: Restore
      run: dotnet restore Du.PMPage.Wpf.sln

    - name: Build & Pack
      run: dotnet build Du.PMPage.Wpf.sln --configuration Release --no-restore -p:Version=$env:PACKAGE_VERSION

    - name: Push to NuGet.org
      run: |
        $nupkg = Get-ChildItem -Path Du.PMPage.Wpf/bin/Release -Filter *.nupkg | Where-Object { $_.Name -notmatch '\.symbols\.' } | Select-Object -First 1
        if (-not $nupkg) {
          Write-Error "No .nupkg found"
          Get-ChildItem Du.PMPage.Wpf/bin/Release -Recurse
          exit 1
        }
        Write-Host "Pushing $($nupkg.Name)"
        dotnet nuget push $nupkg.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NugetKey }} --skip-duplicate

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: Du.PMPage.Wpf/bin/Release/*.nupkg
